<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atsijungimo patvirtinimo langas</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/app.js" defer></script>
</head>
<body class="dialog-page">
    <!-- Modalinis dialogas virš lango, iš kurio iškviečiamas (navbar'e „Atsijungti“ yra visuose languose) -->
    <iframe class="dialog-bg" id="bg" tabindex="-1" aria-hidden="true" inert></iframe>
    <div class="dialog-overlay">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
            <div class="window-header">
                <div>
                    <div class="window-kind">Dialogas</div>
                    <h1 id="dlg-title">Atsijungimo patvirtinimo langas</h1>
                </div>
            </div>
            <div class="dialog-body">
                <p>Ar tikrai norite atsijungti nuo sistemos?</p>
            </div>
            <div class="dialog-actions">
                <a class="btn btn-secondary" href="Vair_pagr.html" data-close>Atšaukti</a>
                <a class="btn btn-primary" href="../index.html" title="Prisijungimo langas">Atsijungti</a>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var parent = 'Vair_pagr.html';
        // Fonas – langas, iš kurio dialogas iškviestas (veikia ir per serverį, ir atidarius failą tiesiai)
        if (PT.prev && !/Ats_patv\.html/.test(PT.prev)) parent = PT.prev;
        document.getElementById('bg').src = parent;
    });
    </script>
</body>
</html>
