<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonos duomenų redagavimo langas</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/app.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-mark">P</span>Parktronikai <small>Parkavimo vietų informacinė sistema</small></div>
        <span class="role-badge" data-role-label></span>
    </header>

    <main class="container">
        <div class="window-header">
            <div>
                <div class="window-kind">Puslapis</div>
                <h1>Zonos duomenų redagavimo langas</h1>
                <p class="window-desc" id="subtitle"></p>
            </div>
            <a class="btn btn-secondary btn-sm" href="Zon_vald.html" data-back>Grįžti</a>
        </div>

        <div class="layout-side">
            <section class="card">
                <h2>Zonos ribos</h2>
                <p class="hint">Galite pridėti naujų ribos taškų spausdami žemėlapyje. Ribos taškų: <strong id="count">0</strong></p>
                <svg class="map muted" id="map" role="img" aria-label="Zonos ribų redagavimas žemėlapyje"></svg>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary btn-sm" id="undo">Atšaukti paskutinį tašką</button>
                </div>
            </section>

            <section class="card">
                <h2>Zonos duomenys</h2>
                <div class="stack">
                    <div class="field"><label for="z-name">Zonos pavadinimas</label><input id="z-name" type="text"></div>
                    <div class="field"><label for="z-addr">Adresas</label><input id="z-addr" type="text"></div>
                    <div class="field"><label for="z-tarif">Tarifas (€/val.)</label><input id="z-tarif" type="number" step="0.05"></div>
                    <div class="field"><label for="z-int">Skaičiuojamas intervalas (min.)</label><input id="z-int" type="number"></div>
                    <div class="field"><label for="z-pay">Mokėjimo gavėjas</label><input id="z-pay" type="text"></div>
                    <label class="choice"><input type="checkbox" id="z-active"> Zona aktyvi</label>
                </div>
            </section>
        </div>

        <section class="card">
            <h2>Apmokestinimo laikas</h2>
            <table class="table">
                <thead><tr><th>Diena</th><th>Pradžios laikas</th><th>Pabaigos laikas</th></tr></thead>
                <tbody id="times"></tbody>
            </table>
        </section>

        <div class="form-actions">
            <a class="btn btn-primary" href="Zon_red_patv.html" title="Zonos redagavimo patvirtinimo langas">Išsaugoti pakeitimus</a>
            <a class="btn btn-secondary" href="Zon_vald.html" data-back>Atšaukti</a>
        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var z = PT.currentZone();
        PT.set('zona', z.id);
        document.getElementById('subtitle').textContent = 'Redaguojama zona: ' + z.Zonos_pavadinimas;
        document.getElementById('z-name').value = z.Zonos_pavadinimas;
        document.getElementById('z-addr').value = z.Adresas;
        document.getElementById('z-tarif').value = z.Tarifas_val.toFixed(2);
        document.getElementById('z-int').value = z.Skaiciuojamas_intervalas_min;
        document.getElementById('z-pay').value = z.Mokejimo_gavejas;
        document.getElementById('z-active').checked = z.Ar_aktyvi;
        document.getElementById('times').innerHTML = z.laikai.map(function (l) {
            return '<tr><td><input type="text" value="' + l[0] + '" aria-label="Diena"></td><td><input type="time" value="' + l[1] +
                '" aria-label="Pradžios laikas"></td><td><input type="time" value="' + l[2] + '" aria-label="Pabaigos laikas"></td></tr>';
        }).join('');
        var svg = document.getElementById('map');
        PT.renderMap(svg, { muted: true });
        var editor = PT.mapEditor(svg, z.points.map(function (p) { return p.slice(); }), document.getElementById('count'));
        document.getElementById('undo').onclick = editor.undo;
    });
    </script>
</body>
</html>
