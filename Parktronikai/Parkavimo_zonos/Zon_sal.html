<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonos šalinimo patvirtinimo langas</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/app.js" defer></script>
</head>
<body class="dialog-page">
    <iframe class="dialog-bg" src="Zon_vald.html" tabindex="-1" aria-hidden="true" inert></iframe>
    <div class="dialog-overlay">
        <form class="dialog danger" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" novalidate>
            <div class="window-header">
                <div>
                    <div class="window-kind">Dialogas</div>
                    <h1 id="dlg-title">Zonos šalinimo patvirtinimo langas</h1>
                </div>
            </div>
            <div class="dialog-body">
                <div class="alert alert-success" id="done" hidden><span class="icon">✓</span><span>Zona sėkmingai pašalinta.</span></div>
                <div class="alert alert-error" id="err" hidden><span class="icon">✕</span><span>Zonos negalima pašalinti, joje yra aktyvių parkavimų.</span></div>
                <div data-hide-on-success>
                    <p>Ar tikrai norite pašalinti zoną <strong id="zname"></strong>?</p>
                    <div class="mock">
                        <strong>Prototipo imitacija:</strong>
                        <label><input type="checkbox" id="mock-err"> zonoje yra aktyvių parkavimų</label>
                    </div>
                </div>
            </div>
            <div class="dialog-actions">
                <a class="btn btn-secondary" href="Zon_vald.html" data-close data-hide-on-success>Atšaukti</a>
                <a class="btn btn-secondary" href="Zon_vald.html" data-close data-show-on-success hidden>Uždaryti</a>
                <button class="btn btn-danger" type="submit" data-hide-on-success>Šalinti zoną</button>
            </div>
        </form>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('zname').textContent = '„' + PT.currentZone().Zonos_pavadinimas + '“';
        document.getElementById('dlg').addEventListener('submit', function (e) {
            e.preventDefault();
            if (document.getElementById('mock-err').checked) { PT.show('err'); return; }
            PT.hide('err');
            PT.showSuccess(this, 'done');
        });
    });
    </script>
</body>
</html>
