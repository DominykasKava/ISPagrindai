<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laikmačio langas</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/app.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-mark">P</span>Parktronikai <small>Parkavimo vietų informacinė sistema</small></div>
        <span class="role-badge" data-role-label></span>
    </header>

    <main class="container narrow">
        <div class="window-header">
            <div>
                <div class="window-kind">Puslapis</div>
                <h1>Laikmačio langas</h1>
                <p class="window-desc">Parkavimo trukmė skaičiuojama nuo parkavimo pradžios.</p>
            </div>
            <a class="btn btn-secondary btn-sm" href="../Klientų_dalis/Zon_info.html" data-back>Grįžti</a>
        </div>

        <section class="card" style="text-align:center">
            <span class="badge badge-ok">Aktyvus parkavimas</span>
            <div class="timer" id="timer" aria-live="off">00:00:00</div>
            <p class="muted">Preliminari suma: <strong id="sum">0,00 €</strong></p>
        </section>

        <section class="card">
            <h2>Parkavimo sesija</h2>
            <dl class="kv">
                <dt>Zona</dt><dd id="zone"></dd>
                <dt>Automobilis</dt><dd><span class="plate" id="car"></span></dd>
                <dt>Tarifas</dt><dd id="tarif"></dd>
                <dt>Pradžia</dt><dd id="start"></dd>
            </dl>
        </section>

        <div class="form-actions">
            <a class="btn btn-primary btn-lg" href="Mok.html" id="stop" title="Atsiskaitymo langas">Užbaigti parkavimą</a>
        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var z = PT.currentZone(), car = PT.currentCar();
        var start = Number(PT.get('start')) || Date.now();
        PT.set('start', String(start));
        document.getElementById('zone').textContent = z.Zonos_pavadinimas;
        document.getElementById('car').textContent = car.Valstybinis_numeris;
        document.getElementById('tarif').textContent = PT.money(z.Tarifas_val) + ' / val. (intervalas ' + z.Skaiciuojamas_intervalas_min + ' min.)';
        document.getElementById('start').textContent = PT.clock(start);
        function tick() {
            var ms = Date.now() - start;
            document.getElementById('timer').textContent = PT.hms(ms);
            var intervals = Math.max(1, Math.ceil(ms / 60000 / z.Skaiciuojamas_intervalas_min));
            document.getElementById('sum').textContent = PT.money(intervals * z.Skaiciuojamas_intervalas_min / 60 * z.Tarifas_val);
        }
        tick(); setInterval(tick, 1000);
        document.getElementById('stop').addEventListener('click', function () { PT.set('end', String(Date.now())); });
    });
    </script>
</body>
</html>
