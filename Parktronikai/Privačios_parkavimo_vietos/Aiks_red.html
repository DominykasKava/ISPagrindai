<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aikštelės redagavimo forma</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/app.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-mark">P</span>Parktronikai <small>Parkavimo vietų informacinė sistema</small></div>
        <span class="role-badge" data-role-label></span>
    </header>

    <main class="container">
        <div class="window-header">
            <div>
                <div class="window-kind">Puslapis</div>
                <h1>Aikštelės redagavimo forma</h1>
                <p class="window-desc">Redaguojama aikštelė: Verslo centras „Nemunas“.</p>
            </div>
            <a class="btn btn-secondary btn-sm" href="Aiks_sav_pagr.html" data-back>Grįžti</a>
        </div>

        <form class="card" novalidate data-result="saved">
            <div class="alert alert-success" id="saved" hidden><span class="icon">✓</span><span>Aikštelės duomenys sėkmingai pakeisti.</span></div>
            <div class="alert alert-error" data-form-error hidden><span class="icon">✕</span><span>Pažymėti laukai neteisingi.</span></div>
            <div class="form-grid">
                <div class="field"><label for="a-name">Pavadinimas</label><input id="a-name" type="text" value="Verslo centras „Nemunas“" data-required></div>
                <div class="field"><label for="a-addr">Adresas</label><input id="a-addr" type="text" value="K. Donelaičio g. 62, Kaunas" data-required></div>
                <div class="field"><label for="a-lat">Įvažiavimo taško platuma</label><input id="a-lat" type="number" step="0.0001" value="54.8985" data-required></div>
                <div class="field"><label for="a-lng">Įvažiavimo taško ilguma</label><input id="a-lng" type="number" step="0.0001" value="23.9036" data-required></div>
                <div class="field"><label for="a-count">Vietų skaičius</label><input id="a-count" type="number" min="1" value="40" data-required></div>
                <div class="field"><label for="a-from">Darbo pradžios laikas</label><input id="a-from" type="time" value="07:00"></div>
                <div class="field"><label for="a-to">Darbo pabaigos laikas</label><input id="a-to" type="time" value="20:00"></div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Išsaugoti</button>
                <a class="btn btn-secondary" href="Aiks_sav_pagr.html" data-back>Atšaukti</a>
            </div>
        </form>
    </main>
</body>
</html>
