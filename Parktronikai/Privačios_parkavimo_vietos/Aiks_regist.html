<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aikštelės registravimo forma</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/app.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-mark">P</span>Parktronikai <small>Parkavimo vietų informacinė sistema</small></div>
        <span class="role-badge" data-role-label></span>
    </header>

    <main class="container">
        <div class="window-header">
            <div>
                <div class="window-kind">Puslapis</div>
                <h1>Aikštelės registravimo forma</h1>
                <p class="window-desc">Nauja aikštelė įsigalios tik administratoriui patvirtinus užklausą.</p>
            </div>
            <a class="btn btn-secondary btn-sm" href="Aiks_sav_pagr.html" data-back>Grįžti</a>
        </div>

        <form class="card" novalidate data-result="sent">
            <div class="alert alert-success" id="sent" hidden><span class="icon">✓</span><span>Užklausa išsiųsta administratoriui. Būsena: <span class="badge badge-warn">Laukia patvirtinimo</span></span></div>
            <div class="alert alert-error" data-form-error hidden><span class="icon">✕</span><span>Įvesti duomenys netinkami.</span></div>
            <div class="form-grid">
                <div class="field"><label for="a-name">Pavadinimas</label><input id="a-name" type="text" data-required placeholder="pvz. Biuro aikštelė „Rasa“"></div>
                <div class="field"><label for="a-addr">Adresas</label><input id="a-addr" type="text" data-required placeholder="Gatvė, namo nr., miestas"></div>
                <div class="field"><label for="a-lat">Įvažiavimo taško platuma</label><input id="a-lat" type="number" step="0.0001" data-required placeholder="54.8985"></div>
                <div class="field"><label for="a-lng">Įvažiavimo taško ilguma</label><input id="a-lng" type="number" step="0.0001" data-required placeholder="23.9036"></div>
                <div class="field"><label for="a-count">Vietų skaičius</label><input id="a-count" type="number" min="1" data-required></div>
                <div class="field"><label for="a-from">Darbo pradžios laikas</label><input id="a-from" type="time" value="08:00"></div>
                <div class="field"><label for="a-to">Darbo pabaigos laikas</label><input id="a-to" type="time" value="18:00"></div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit" data-hide-on-success>Pateikti užklausą</button>
                <a class="btn btn-secondary" href="Aiks_sav_pagr.html" data-back>Atšaukti</a>
            </div>
        </form>
    </main>
</body>
</html>
